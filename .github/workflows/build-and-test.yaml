name: Build/Test

on:
  workflow_call:
    secrets:
      CHARMHUB_TOKEN:
        required: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo snap install --classic astral-uv
      - name: Run linters
        run: make lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo snap install --classic astral-uv
      - name: Run tests
        run: make unit

  lib-check:
    name: Check libraries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check libs
        uses: canonical/charming-actions/check-libraries@2.7.0
        with:
          credentials: "${{ secrets.CHARMHUB_TOKEN }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"

  pack-rock:
    name: Build ROCK
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.test-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup LXD
        uses: canonical/setup-lxd@v1

      - name: Install rockcraft
        run: sudo snap install rockcraft --edge --classic

      - name: Pack ROCK
        run: rockcraft pack --verbose

      - name: Validate non-root ROCK
        run: |
          sudo snap install --classic astral-uv
          sudo apt-get install -y skopeo
          sudo skopeo --insecure-policy copy \
            "oci-archive:$(realpath ./zinc_*.rock)" \
            "docker-daemon:zinc:non-root-test"
          ZINC_TEST_IMAGE=zinc:non-root-test make rock-test

      - name: Upload test ROCK to ttl.sh
        id: test-image
        run: |
          image="ttl.sh/zinc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:6h"
          sudo skopeo --insecure-policy copy \
            "oci-archive:$(realpath ./zinc_*.rock)" \
            "docker://${image}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  pack-charm:
    name: Build charm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Cache wheels
        id: cache-wheels
        uses: actions/cache@v6
        with:
          path: /home/runner/snap/charmcraft/common/cache/charmcraft
          key: ${{ runner.os }}-wheel-cache-${{ hashFiles('./uv.lock') }}
          # If the above cache key doesn't match, it's because the uv.lock has changed.
          # Even so, pre-existing caches may still contain useful cached builds for some
          # portion of the dependencies, and restore-keys can partially match a cache.
          restore-keys: |
            ${{ runner.os }}-wheel-cache-

      - name: Pack charm
        run: charmcraft pack -v

      - name: Upload charm artifact
        uses: actions/upload-artifact@v7
        with:
          name: charm
          path: ./*.charm

  define-matrix:
    name: Define spread matrix
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Generate matrix list
        id: suites
        run: |
          list="$(charmcraft.spread --list lxd | sed "s|lxd:ubuntu-24.04:tests/spread/||g" | jq -r -ncR '[inputs | select(length>0)]')"
          echo "suites=$list"
          echo "suites=$list" >> $GITHUB_OUTPUT

  integration-test:
    name: Spread (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    needs:
      - define-matrix
      - lint
      - pack-charm
      - pack-rock
      - unit-test
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.define-matrix.outputs.suites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download charm artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v4
        with:
          name: charm

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Cache wheels
        id: cache-wheels
        uses: actions/cache@v6
        with:
          path: /home/runner/snap/charmcraft/common/cache/charmcraft
          key: ${{ runner.os }}-wheel-cache-${{ hashFiles('./uv.lock') }}
          # If the above cache key doesn't match, it's because the uv.lock has changed.
          # Even so, pre-existing caches may still contain useful cached builds for some
          # portion of the dependencies, and restore-keys can partially match a cache.
          restore-keys: |
            ${{ runner.os }}-wheel-cache-

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic

      - name: Configure test ROCK resource
        env:
          ZINC_TEST_IMAGE: ${{ needs.pack-rock.outputs.image }}
        run: |
          sudo snap install yq
          /snap/bin/yq -i '.resources.zinc-image.upstream-source = strenv(ZINC_TEST_IMAGE)' charmcraft.yaml

      - name: Run integration tests
        run: |
          charmcraft.spread -v "lxd:ubuntu-24.04:tests/spread/${{ matrix.suite }}"
